<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 512px;
    height: 512px;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .app-icon {
    width: 512px;
    height: 512px;
    background: radial-gradient(circle at 30% 25%, #2e1065 0%, #0f172a 50%, #000000 100%);
    border-radius: 115px; /* iOS Squircle */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    box-shadow: inset 0 2px 8px rgba(255, 255, 255, 0.4), inset 0 -4px 12px rgba(0, 0, 0, 0.8);
    border: 2px solid rgba(255, 255, 255, 0.15);
  }
  .glow-ring {
    position: absolute;
    width: 330px;
    height: 330px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(99, 102, 241, 0.5) 0%, rgba(236, 72, 153, 0.25) 60%, transparent 80%);
    filter: blur(25px);
  }
  .bolt-svg {
    width: 230px;
    height: 230px;
    fill: url(#boltGrad);
    filter: drop-shadow(0 0 24px rgba(245, 158, 11, 0.85)) drop-shadow(0 0 45px rgba(236, 72, 153, 0.65));
    z-index: 2;
    margin-top: -30px;
  }
  .brand-text {
    position: absolute;
    bottom: 56px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 1.5px;
    color: #ffffff;
    text-shadow: 0 4px 18px rgba(0, 0, 0, 0.95), 0 0 25px rgba(99, 102, 241, 0.7);
    z-index: 2;
    text-align: center;
    width: 100%;
  }
</style>
</head>
<body>
  <div class="app-icon">
    <div class="glow-ring"></div>
    <svg class="bolt-svg" viewBox="0 0 24 24">
      <defs>
        <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fbbf24"/>
          <stop offset="50%" stop-color="#f59e0b"/>
          <stop offset="100%" stop-color="#ec4899"/>
        </linearGradient>
      </defs>
      <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
    </svg>
    <div class="brand-text">Danh học IELTS</div>
  </div>
</body>
</html>
