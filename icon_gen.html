<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 512px;
    height: 512px;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Arial Black", "Montserrat", "Segoe UI Black", sans-serif;
  }
  .app-icon {
    width: 512px;
    height: 512px;
    background: radial-gradient(circle at 50% 30%, #1e1028 0%, #0d111e 55%, #030712 100%);
    border-radius: 115px; /* Chuẩn Apple iOS Squircle */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    box-shadow: inset 0 2px 10px rgba(255, 255, 255, 0.35), inset 0 -6px 18px rgba(0, 0, 0, 0.9);
    border: 3.5px solid rgba(255, 255, 255, 0.18);
    overflow: hidden;
  }
  
  /* Hào quang đỏ rực kết hợp vàng kim sang trọng */
  .halo-glow {
    position: absolute;
    width: 380px;
    height: 380px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(225, 29, 72, 0.4) 0%, rgba(234, 179, 8, 0.2) 55%, transparent 75%);
    filter: blur(32px);
    z-index: 1;
  }

  /* Khung chứa trung tâm */
  .center-content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-top: -6px;
  }

  /* Chữ IELTS THẬT TO - MÀU ĐỎ CHUẨN THƯƠNG HIỆU QUỐC TẾ */
  .ielts-hero-text {
    font-size: 138px;
    font-weight: 950;
    line-height: 0.95;
    letter-spacing: 5px;
    text-transform: uppercase;
    background: linear-gradient(180deg, #ff4d6d 0%, #e11d48 45%, #be123c 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 18px rgba(225, 29, 72, 0.7)) drop-shadow(0 8px 30px rgba(0, 0, 0, 0.9));
  }

  /* Khối Huy Hiệu Điểm 9.0 MÀU VÀNG - NHỎ LẠI */
  .score-capsule {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(15, 23, 42, 0.85);
    border: 2px solid rgba(234, 179, 8, 0.75);
    padding: 8px 26px;
    border-radius: 999px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), 0 0 16px rgba(234, 179, 8, 0.35), inset 0 0 12px rgba(234, 179, 8, 0.2);
  }

  .star-gold {
    font-size: 20px;
    color: #facc15;
    filter: drop-shadow(0 0 5px #facc15);
    line-height: 1;
  }

  .score-label-sub {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 2.5px;
    color: #ffffff;
    opacity: 0.95;
  }

  .score-gold-number {
    font-size: 52px;
    font-weight: 950;
    line-height: 1;
    letter-spacing: 0.5px;
    background: linear-gradient(180deg, #ffffff 10%, #fef08a 40%, #facc15 75%, #ca8a04 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 8px rgba(234, 179, 8, 0.8));
    margin-left: 2px;
  }

  /* Chỉ vàng trang trí dưới đáy */
  .bottom-accent {
    position: absolute;
    bottom: 24px;
    width: 150px;
    height: 3px;
    background: linear-gradient(90deg, transparent, rgba(234, 179, 8, 0.8), transparent);
    border-radius: 999px;
    z-index: 2;
  }
</style>
</head>
<body>
  <div class="app-icon">
    <div class="halo-glow"></div>
    
    <div class="center-content">
      <!-- Chữ IELTS màu đỏ thật to chuẩn font chữ -->
      <div class="ielts-hero-text">IELTS</div>

      <!-- Chữ 9.0 màu vàng nhỏ lại -->
      <div class="score-capsule">
        <span class="star-gold">★</span>
        <span class="score-label-sub">BAND</span>
        <span class="score-gold-number">9.0</span>
        <span class="star-gold">★</span>
      </div>
    </div>

    <div class="bottom-accent"></div>
  </div>
</body>
</html>
