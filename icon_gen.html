<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 512px;
    height: 512px;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .app-icon {
    width: 512px;
    height: 512px;
    background: radial-gradient(circle at 35% 25%, #1e1b4b 0%, #0f172a 50%, #020617 100%);
    border-radius: 115px; /* iOS Human Interface Guidelines Squircle */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    box-shadow: inset 0 2px 10px rgba(255, 255, 255, 0.35), inset 0 -6px 16px rgba(0, 0, 0, 0.85);
    border: 3px solid rgba(255, 255, 255, 0.18);
    overflow: hidden;
  }
  
  /* Hào quang vàng hoàng gia biểu trưng cho Band 9.0 Expert */
  .halo-glow {
    position: absolute;
    width: 360px;
    height: 360px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(234, 179, 8, 0.35) 0%, rgba(225, 29, 72, 0.2) 50%, transparent 75%);
    filter: blur(28px);
    z-index: 1;
  }

  /* Huy hiệu đỏ IELTS đặc trưng chuẩn quốc tế */
  .ielts-badge {
    position: relative;
    z-index: 2;
    background: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
    border-radius: 18px;
    padding: 8px 32px;
    box-shadow: 0 4px 16px rgba(225, 29, 72, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.4);
    border: 1.5px solid rgba(255, 255, 255, 0.3);
    margin-bottom: 6px;
    margin-top: -10px;
  }
  .ielts-text {
    font-size: 42px;
    font-weight: 950;
    color: #ffffff;
    letter-spacing: 5px;
    text-transform: uppercase;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    line-height: 1;
  }

  /* Con số 9.0 Hoàng Kim Đỉnh Cao */
  .score-container {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: baseline;
    justify-content: center;
    line-height: 1;
    margin: 4px 0 6px 0;
  }
  .score-number {
    font-size: 168px;
    font-weight: 950;
    letter-spacing: -4px;
    background: linear-gradient(180deg, #ffffff 15%, #fef08a 45%, #eab308 75%, #ca8a04 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 16px rgba(234, 179, 8, 0.65)) drop-shadow(0 8px 30px rgba(0, 0, 0, 0.9));
  }

  /* Dải ruy băng chứng chỉ EXPERT USER */
  .expert-pill {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255, 255, 255, 0.08);
    border: 1.5px solid rgba(234, 179, 8, 0.6);
    padding: 6px 22px;
    border-radius: 999px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4), inset 0 0 12px rgba(234, 179, 8, 0.2);
  }
  .star-icon {
    font-size: 16px;
    color: #facc15;
    filter: drop-shadow(0 0 4px #facc15);
  }
  .expert-text {
    font-size: 20px;
    font-weight: 850;
    letter-spacing: 2.5px;
    color: #fef08a;
    text-transform: uppercase;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
  }

  /* Viền kim loại vàng gold trang trí góc */
  .gold-accent-line {
    position: absolute;
    bottom: 22px;
    width: 140px;
    height: 3px;
    background: linear-gradient(90deg, transparent, #eab308, transparent);
    border-radius: 999px;
    z-index: 2;
  }
</style>
</head>
<body>
  <div class="app-icon">
    <div class="halo-glow"></div>
    
    <!-- Huy hiệu IELTS màu đỏ chuẩn nhận diện Cambridge & IDP -->
    <div class="ielts-badge">
      <div class="ielts-text">IELTS</div>
    </div>

    <!-- Số điểm huyền thoại 9.0 -->
    <div class="score-container">
      <span class="score-number">9.0</span>
    </div>

    <!-- Huy hiệu chuẩn mực EXPERT USER -->
    <div class="expert-pill">
      <span class="star-icon">★</span>
      <span class="expert-text">OVERALL BAND</span>
      <span class="star-icon">★</span>
    </div>

    <div class="gold-accent-line"></div>
  </div>
</body>
</html>
